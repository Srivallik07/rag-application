documents:
  input_dir: data/documents/healthcare
  glob_patterns:
    - "**/*.txt"
  chunk_size: 1000
  chunk_overlap: 200

vector_store:
  provider: faiss
  path: storage/healthcare_faiss_index
  top_k: 5
  normalize_embeddings: true
  allow_dangerous_deserialization: true
  chroma_collection: healthcare_rag_documents
  chroma_host: api.trychroma.com

retrieval:
  mode: adaptive
  advanced_fetch_multiplier: 4
  diversity_lambda: 0.7
  corrective_min_overlap: 1

embeddings:
  provider: local
  model: text-embedding-3-small
  local_dimensions: 384

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.0
  max_tokens: 800
  timeout_seconds: 60

domain:
  name: healthcare
  assistant_title: Healthcare RAG Assistant
  min_source_documents: 50
  auto_index_on_startup: true
  allow_uploads: false
  system_prompt: |
    You are a healthcare domain RAG clinical information assistant.
    Answer only from the retrieved healthcare corpus documents (55 indexed clinical reference documents).
    Provide clear, structured answers for clinicians and care teams.
    If the retrieved context does not support an answer, say: "The indexed healthcare documents do not contain enough information."
    Do not provide personalized medical diagnosis or emergency instructions; recommend professional evaluation when appropriate.
    Do not invent drugs, doses, or guidelines. Cite evidence using [source:rank].
    Use plain language and mention document titles or categories when helpful.

langsmith:
  enabled: true
  project_name: healthcare-rag-production

logging:
  level: INFO
  file: logs/rag.log
